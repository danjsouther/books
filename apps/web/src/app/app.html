<header>
  <mat-toolbar color="primary">
    <a routerLink="/" class="brand">{{ title() }}</a>

    <nav aria-label="Main">
      <ul class="nav-list">
        @for (item of navItems; track item.path) {
          <li>
            <a [routerLink]="item.path" routerLinkActive="active" class="nav-link">
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
  </mat-toolbar>
</header>

<main>
  <router-outlet />
</main>

<footer>
  <div class="footer-content">A reading list for people who argue about release dates.</div>
</footer>

<!--
  Route announcements for screen readers. The router does not announce
  navigation on its own in an SPA, so without this a keyboard/SR user gets no
  feedback that the page changed.
-->
<p aria-live="polite" aria-atomic="true" class="cdk-visually-hidden">{{ routeAnnouncement() }}</p>
