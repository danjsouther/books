<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#242235"/>
      <stop offset="100%" stop-color="#17151f"/>
    </linearGradient>

    <linearGradient id="purpleTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="purpleSpine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>

    <linearGradient id="blueTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="blueSpine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <linearGradient id="indigoTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c46a3"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="indigoSpine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26235f"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="pageShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e7e7ec"/>
      <stop offset="100%" stop-color="#f7f7fa"/>
    </linearGradient>

    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1024" height="1024" fill="#ffffff"/>
  <rect x="95" y="95" width="834" height="834" rx="170" ry="170" fill="url(#bgGrad)" filter="url(#softShadow)"/>

  <g transform="translate(0,-76)">
  <!-- ===================== BOTTOM BOOK (indigo) — backY=471 — drawn first, furthest back ===================== -->
  <g>
    <!-- board-edge thickness under the cover -->
    <polygon points="512,775 512,789 800,637 800,623" fill="url(#indigoSpine)"/>
    <polygon points="222,623 222,637 512,789 512,775" fill="url(#indigoSpine)"/>
    <!-- spine face -->
    <polygon points="222,637 222,693 512,845 512,789" fill="url(#indigoSpine)"/>
    <!-- pages -->
    <polygon points="512,789 512,845 800,693 800,637" fill="url(#pageShade)"/>
    <g stroke="#c9c9d2" stroke-width="3" opacity="0.8">
      <line x1="540" y1="796" x2="775" y2="666"/>
      <line x1="540" y1="811" x2="775" y2="681"/>
      <line x1="540" y1="826" x2="775" y2="696"/>
    </g>
    <!-- top cover -->
    <polygon points="222,623 512,471 800,623 512,775" fill="url(#indigoTop)"/>
    <polygon points="222,623 512,471 512,487 222,639" fill="#ffffff" opacity="0.08"/>
  </g>

  <!-- ===================== MIDDLE BOOK (blue) — backY=401 — drawn second ===================== -->
  <g>
    <polygon points="512,705 512,719 800,567 800,553" fill="url(#blueSpine)"/>
    <polygon points="222,553 222,567 512,719 512,705" fill="url(#blueSpine)"/>
    <polygon points="222,567 222,623 512,775 512,719" fill="url(#blueSpine)"/>
    <polygon points="512,719 512,775 800,623 800,567" fill="url(#pageShade)"/>
    <g stroke="#c9c9d2" stroke-width="3" opacity="0.8">
      <line x1="540" y1="726" x2="775" y2="596"/>
      <line x1="540" y1="741" x2="775" y2="611"/>
      <line x1="540" y1="756" x2="775" y2="626"/>
    </g>
    <polygon points="222,553 512,401 800,553 512,705" fill="url(#blueTop)"/>
    <polygon points="222,553 512,401 512,417 222,569" fill="#ffffff" opacity="0.10"/>
  </g>

  <!-- ===================== TOP BOOK (purple) — backY=331 — drawn last, in front ===================== -->
  <g>
    <polygon points="512,635 512,649 800,497 800,483" fill="url(#purpleSpine)"/>
    <polygon points="222,483 222,497 512,649 512,635" fill="url(#purpleSpine)"/>
    <polygon points="222,497 222,553 512,705 512,649" fill="url(#purpleSpine)"/>
    <polygon points="512,649 512,705 800,553 800,497" fill="url(#pageShade)"/>
    <g stroke="#c9c9d2" stroke-width="3" opacity="0.8">
      <line x1="540" y1="656" x2="775" y2="526"/>
      <line x1="540" y1="671" x2="775" y2="541"/>
      <line x1="540" y1="686" x2="775" y2="556"/>
    </g>
    <polygon points="222,483 512,331 800,483 512,635" fill="url(#purpleTop)"/>
    <polygon points="222,483 512,331 512,347 222,499" fill="#ffffff" opacity="0.14"/>
  </g>
  </g>
</svg>
